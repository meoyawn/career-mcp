# Deploys master: checks and tests, then D1 migrations, then the Worker.
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          mise_toml: |
            [tools]
            node = "24"
            "github:aubepkg/aube" = "2.5.1"
            task = "latest"
      - run: aube install --frozen-lockfile
      # Logs of this public repository are public: hide the Worker's address.
      - run: task deploy 2>&1 | sed -E 's#[A-Za-z0-9.-]+\.workers\.dev#<worker>.workers.dev#g'
        shell: bash
